          <path d="M -9 -15 C -2 -6 -2 6 -9 15" fill="none" stroke="#002f6c" stroke-width="1.5"/>
          <path d="M 9 -15 C 2 -6 2 6 9 15" fill="none" stroke="#002f6c" stroke-width="1.5"/>
