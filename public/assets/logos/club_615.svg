  </defs>
  <!-- Main Shield -->
  <path d="M 60 8 C 84 8 106 14 106 42 C 106 78 60 112 60 112 C 60 112 14 78 14 42 C 14 14 36 8 60 8 Z" fill="url(#grad-REDBERGSLIDSIK)" stroke="#fbbf24" stroke-width="3" filter="url(#shadow-REDBERGSLIDSIK)" />
  <!-- Inner Border Line -->
  <path d="M 60 15 C 80 15 98 20 98 44 C 98 74 60 102 60 102 C 60 102 22 74 22 44 C 22 20 40 15 60 15 Z" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.6" />
  
  
        <!-- RIK Gothenburg Crest & Stars -->
        <g transform="translate(60, 50)">
          <!-- White diagonal stripes -->
          <line x1="-30" y1="-20" x2="30" y2="30" stroke="#ffffff" stroke-width="6" opacity="0.3"/>
          <line x1="-30" y1="-5" x2="30" y2="45" stroke="#ffffff" stroke-width="6" opacity="0.3"/>
          <!-- Central Handball -->
