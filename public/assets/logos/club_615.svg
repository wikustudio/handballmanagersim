        </g>
        

  <!-- Bottom Ribbon / Club Label -->
  <rect x="16" y="82" width="88" height="15" rx="3" fill="#ffffff" stroke="#fbbf24" stroke-width="1" />
  <text x="60" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" fill="#002f6c" text-anchor="middle" dominant-baseline="central" letter-spacing="0.5">REDBERGSLIDS IK</text>
  <!-- Sublabel -->
