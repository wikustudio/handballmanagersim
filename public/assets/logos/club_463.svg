<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad-BESANÇONII" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="100%" stop-color="#500724" />
    </linearGradient>
    <filter id="shadow-BESANÇONII" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Main Shield -->
  <path d="M 60 8 C 84 8 106 14 106 42 C 106 78 60 112 60 112 C 60 112 14 78 14 42 C 14 14 36 8 60 8 Z" fill="url(#grad-BESANÇONII)" stroke="#1e3a8a" stroke-width="3" filter="url(#shadow-BESANÇONII)" />
  <!-- Inner Border Line -->
  <path d="M 60 15 C 80 15 98 20 98 44 C 98 74 60 102 60 102 C 60 102 22 74 22 44 C 22 20 40 15 60 15 Z" fill="none" stroke="#1e3a8a" stroke-width="1.2" opacity="0.6" />
  
  
        <!-- Besançon Eagle & Handball -->
        <g transform="translate(60, 48)">
          <polygon points="0,-18 16,-6 10,12 0,18 -10,12 -16,-6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
          <circle cx="0" cy="0" r="10" fill="#831843" stroke="#ffffff" stroke-width="1.5"/>
          <text x="0" y="3" font-family="system-ui, sans-serif" font-weight="900" font-size="8" fill="#ffffff" text-anchor="middle">ESB</text>
        </g>
        

  <!-- Bottom Ribbon / Club Label -->
  <rect x="16" y="82" width="88" height="15" rx="3" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1" />
  <text x="60" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.5">BESANÇON II</text>
  <!-- Sublabel -->
  <text x="60" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="5.5" font-weight="800" fill="#1e3a8a" text-anchor="middle" letter-spacing="0.8">FRANCHE-COMTÉ</text>
