<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gonfreville-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="gonfreville-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Shield Outline -->
  <path d="M 100 10 L 175 40 C 175 125 100 185 100 185 C 100 185 25 125 25 40 Z" fill="url(#gonfreville-bg)" stroke="#fbbf24" stroke-width="4" stroke-linejoin="round" />
  <!-- Inner Border -->
  <path d="M 100 20 L 165 46 C 165 118 100 172 100 172 C 100 172 35 118 35 46 Z" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.6" />
  
  <!-- Normandy Maritime Anchor & Handball -->
  <g transform="translate(100, 95)">
    <!-- Anchor Ring -->
    <circle cx="0" cy="-45" r="10" fill="none" stroke="url(#gonfreville-gold)" stroke-width="4" />
    <!-- Anchor Crossbar -->
    <line x1="-24" y1="-30" x2="24" y2="-30" stroke="url(#gonfreville-gold)" stroke-width="4" stroke-linecap="round" />
    <!-- Anchor Shank -->
    <line x1="0" y1="-45" x2="0" y2="35" stroke="url(#gonfreville-gold)" stroke-width="5" stroke-linecap="round" />
    <!-- Anchor Flukes -->
    <path d="M -38 10 C -38 42 0 48 0 48 C 0 48 38 42 38 10" fill="none" stroke="url(#gonfreville-gold)" stroke-width="5" stroke-linecap="round" />
    <polygon points="-38,6 -44,14 -32,14" fill="#fbbf24" />
    <polygon points="38,6 32,14 44,14" fill="#fbbf24" />
    
    <!-- Central Handball -->
    <circle cx="0" cy="-5" r="18" fill="#ffffff" stroke="#991b1b" stroke-width="2" />
    <path d="M -9 -18 C -2 -7 -2 7 -9 18" fill="none" stroke="#991b1b" stroke-width="1.5" />
    <path d="M 9 -18 C 2 -7 2 7 9 18" fill="none" stroke="#991b1b" stroke-width="1.5" />
    <path d="M -18 0 L 18 0" stroke="#991b1b" stroke-width="1.5" />
  </g>

  <!-- Banner text -->
  <path d="M 40 40 Q 100 55 160 40" fill="none" id="curve-gonfreville" />
  <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#ffffff" letter-spacing="1.5">
    <textPath href="#curve-gonfreville" startOffset="50%" text-anchor="middle">
      GONFREVILLE
    </textPath>
  </text>
  <text x="100" y="158" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" fill="#fbbf24" text-anchor="middle" letter-spacing="2">
    HANDBALL
  </text>
</svg>
