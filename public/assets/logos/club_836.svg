<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad-KONGSBERGHK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="shadow-KONGSBERGHK" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Main Shield -->
  <path d="M 60 8 C 84 8 106 14 106 42 C 106 78 60 112 60 112 C 60 112 14 78 14 42 C 14 14 36 8 60 8 Z" fill="url(#grad-KONGSBERGHK)" stroke="#e2e8f0" stroke-width="3" filter="url(#shadow-KONGSBERGHK)" />
  <!-- Inner Border Line -->
  <path d="M 60 15 C 80 15 98 20 98 44 C 98 74 60 102 60 102 C 60 102 22 74 22 44 C 22 20 40 15 60 15 Z" fill="none" stroke="#e2e8f0" stroke-width="1.2" opacity="0.6" />
  
  
        <!-- Silver Mining Crossed Hammers & Ball -->
        <g transform="translate(60, 48)">
          <!-- Crossed Hammers -->
          <line x1="-18" y1="-18" x2="18" y2="18" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
          <line x1="18" y1="-18" x2="-18" y2="18" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
          <!-- Handball -->
          <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
          <path d="M -7 -12 C -2 -4 -2 4 -7 12" fill="none" stroke="#1d4ed8" stroke-width="1.3"/>
          <path d="M 7 -12 C 2 -4 2 4 7 12" fill="none" stroke="#1d4ed8" stroke-width="1.3"/>
        </g>
        

  <!-- Bottom Ribbon / Club Label -->
  <rect x="16" y="82" width="88" height="15" rx="3" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="1" />
  <text x="60" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" fill="#1e3a8a" text-anchor="middle" dominant-baseline="central" letter-spacing="0.5">KONGSBERG HK</text>
  <!-- Sublabel -->
  <text x="60" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="5.5" font-weight="800" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.8">SØLVBYEN</text>
</svg>