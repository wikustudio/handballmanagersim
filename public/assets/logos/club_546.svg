<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tenerife-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="tenerife-snow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <!-- Shield Outline -->
  <path d="M 100 12 C 160 12 180 25 180 85 C 180 140 100 188 100 188 C 100 188 20 140 20 85 C 20 25 40 12 100 12 Z" fill="url(#tenerife-bg)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
  <!-- Tenerife Cross of St Andrew -->
  <line x1="32" y1="26" x2="168" y2="162" stroke="#ffffff" stroke-width="12" opacity="0.35" />
  <line x1="168" y1="26" x2="32" y2="162" stroke="#ffffff" stroke-width="12" opacity="0.35" />

  <!-- Mount Teide Silhouette -->
  <polygon points="100,60 145,130 55,130" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
  <polygon points="100,60 115,85 85,85" fill="url(#tenerife-snow)" />

  <!-- Central Handball in Sun / Volcano glow -->
  <circle cx="100" cy="115" r="22" fill="#fbbf24" stroke="#ffffff" stroke-width="2" />
  <path d="M 89 98 C 96 108 96 122 89 132" fill="none" stroke="#b45309" stroke-width="2" />
  <path d="M 111 98 C 104 108 104 122 111 132" fill="none" stroke="#b45309" stroke-width="2" />
  <path d="M 78 115 L 122 115" stroke="#b45309" stroke-width="2" />

  <!-- Text -->
  <text x="100" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    BM TENERIFE
  </text>
  <text x="100" y="165" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" fill="#93c5fd" text-anchor="middle" letter-spacing="1.5">
    ISLAS CANARIAS
  </text>
</svg>
