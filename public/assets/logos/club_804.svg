<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad-RUNAR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="shadow-RUNAR" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Main Shield -->
  <path d="M 60 8 C 84 8 106 14 106 42 C 106 78 60 112 60 112 C 60 112 14 78 14 42 C 14 14 36 8 60 8 Z" fill="url(#grad-RUNAR)" stroke="#ffffff" stroke-width="3" filter="url(#shadow-RUNAR)" />
  <!-- Inner Border Line -->
  <path d="M 60 15 C 80 15 98 20 98 44 C 98 74 60 102 60 102 C 60 102 22 74 22 44 C 22 20 40 15 60 15 Z" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.6" />
  
  
        <!-- Runar Shield Cross & Ball -->
        <g transform="translate(60, 48)">
          <!-- White chevron / cross -->
          <path d="M -24 -16 L 24 -16 L 24 -4 L 6 -4 L 6 22 L -6 22 L -6 -4 L -24 -4 Z" fill="#ffffff" opacity="0.9"/>
          <!-- Inner Handball -->
          <circle cx="0" cy="0" r="13" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
          <path d="M -6 -11 C -1 -4 -1 4 -6 11" fill="none" stroke="#18181b" stroke-width="1.4"/>
          <path d="M 6 -11 C 1 -4 1 4 6 11" fill="none" stroke="#18181b" stroke-width="1.4"/>
        </g>
        

  <!-- Bottom Ribbon / Club Label -->
  <rect x="16" y="82" width="88" height="15" rx="3" fill="#dc2626" stroke="#ffffff" stroke-width="1" />
  <text x="60" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.5">RUNAR</text>
  <!-- Sublabel -->
  <text x="60" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="5.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">SANDEFJORD</text>
</svg>