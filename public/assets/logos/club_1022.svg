<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg-1022" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow-1022" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d4ed8" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Heraldic Shield Body -->
  <path d="M 10 10 H 90 V 54 C 90 76 50 94 50 94 C 50 94 10 76 10 54 Z" fill="url(#bg-1022)" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow-1022)" />
  <!-- Inner Rim -->
  <path d="M 16 16 H 84 V 52 C 84 71 50 87 50 87 C 50 87 16 71 16 52 Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
  <!-- Diagonal Heraldic Sash -->
  <path d="M 16 26 L 74 84 L 84 84 L 84 74 L 26 16 L 16 16 Z" fill="#ffffff" opacity="0.2" />
  <!-- Heraldic Star / Handball Crest Top -->
  <polygon points="50,22 53,29 60,30 55,35 56,42 50,38 44,42 45,35 40,30 47,29" fill="#ffffff" opacity="0.85" />
  <!-- Club Monogram -->
  <text x="50" y="66" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="1">VJ</text>
  <!-- Lower Shield Accent Dot -->
  <circle cx="50" cy="78" r="2.5" fill="#ffffff" opacity="0.8" />
</svg>